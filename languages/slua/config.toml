name = "SLua"
grammar = "luau"
path_suffixes = ["slua", "luau"]
line_comments = ["-- "]
tab_size = 4
hard_tabs = false
decrease_indent_pattern = "^\\s*(end|else|elseif|until)\\b"
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true, not_in = ["comment", "string"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["comment", "string"] },
  { start = "(", end = ")", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
